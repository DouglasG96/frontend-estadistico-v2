# Config para /etc/nginx/conf.d/default.conf
# Solo http/server context (el main nginx.conf ya tiene worker_processes, events, etc.)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── PWA Service Worker ──────────────────────────
    location /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # ── Static assets with immutable cache ──────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # ── PWA manifest ────────────────────────────────
    location = /manifest.webmanifest {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Content-Type "application/manifest+json";
        access_log off;
    }

    # ── Favicon & icons ─────────────────────────────
    location ~* \.(ico|svg|png|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # ── API Proxy hacia el backend ──────────────────
    location /api/ {
        # Rate limiting (descomentar si se usa)
        # limit_req zone=api burst=20 nodelay;
        # limit_conn addr 10;

        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # SSL para upstreams HTTPS
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # Body size (fotos de hasta 50MB)
        client_max_body_size 50M;
        client_body_buffer_size 256k;
    }

    # ── SPA fallback ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # ── Deny access to hidden files ────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}