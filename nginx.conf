# Nginx config — production-grade para SPA + PWA + API proxy
# Corre como non-root (nginx user) dentro del contenedor

# Número de workers = número de CPUs
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    multi_accept on;
    worker_connections 65535;
    use epoll;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Efficient file serving
    sendfile on;
    sendfile_max_chunk 1m;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeouts
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_header_timeout 20s;
    client_body_timeout 60s;

    # Size limits
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Buffer settings
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # Logging
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time"'
    '}';

    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # ── Gzip ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Rate limiting (opcional, descomentar si se necesita) ──
    # limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ── Server ──────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ── Security Headers ──────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ── PWA Service Worker ──────────────────────────
        location /sw.js {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Service-Worker-Allowed "/";
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        # ── Static assets with immutable cache ──────────
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            access_log off;
        }

        # ── PWA manifest ────────────────────────────────
        location = /manifest.webmanifest {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header Content-Type "application/manifest+json";
            access_log off;
        }

        # ── Favicon & icons ─────────────────────────────
        location ~* \.(ico|svg|png|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            access_log off;
        }

        # ── API Proxy hacia el backend ──────────────────
        location /api/ {
            # Rate limiting (descomentar si se usa)
            # limit_req zone=api burst=20 nodelay;
            # limit_conn addr 10;

            proxy_pass http://localhost:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;

            # Body size (fotos de hasta 50MB)
            client_max_body_size 50M;
            client_body_buffer_size 256k;
        }

        # ── SPA fallback ────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }

        # ── Deny access to hidden files ────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ── Deny access to system files ─────────────────
        location ~ (\.env|composer\.|package\b|Dockerfile|nginx\.conf) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}